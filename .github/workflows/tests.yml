# Runs the linter and the test suite on GitHub's servers after every push and
# pull request. The tests need no network; the 4 visibility test cases that need
# the 17 MB JPL DE421 ephemeris are skipped here because it is not downloaded.
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: python -m pip install "skyfield>=1.54" "sgp4>=2.26" numpy matplotlib pytest "ruff==0.17.3"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Test
        run: pytest -rs
